<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Value Cabs — Rotate</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#004b76;
  font-family:'Raleway',sans-serif;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* Portrait = show rotate prompt */
.prompt {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  text-align:center;
  padding:32px;
}
.phone-icon {
  font-size:72px;
  animation:rock 1.5s ease-in-out infinite alternate;
}
@keyframes rock {
  from { transform:rotate(0deg); }
  to   { transform:rotate(-90deg); }
}
.title {
  font-weight:900;
  font-size:clamp(18px,4vw,24px);
  color:#fff;
  text-transform:uppercase;
  letter-spacing:1px;
}
.sub {
  font-size:clamp(13px,2.5vw,16px);
  color:rgba(255,255,255,0.6);
  font-weight:500;
  line-height:1.6;
  max-width:280px;
}

/* Landscape = hide prompt (quiz will load) */
@media (orientation:landscape) {
  .prompt { display:none; }
}
</style>
</head>
<body>
<div class="prompt">
  <div class="phone-icon">📱</div>
  <div class="title">Please rotate your phone</div>
  <div class="sub">Turn your phone to portrait mode to begin the quiz.</div>
</div>

<script>
function goToQuiz(){
  window.location.href = 'quiz.html';
}

function check(){
  var portrait = window.innerHeight > window.innerWidth;
  if(portrait){
    /* We're in portrait — go to quiz */
    goToQuiz();
  }
  /* If landscape — prompt shows via CSS, keep checking */
}

/* Check immediately */
check();

/* Keep checking on orientation change */
window.addEventListener('orientationchange', function(){
  setTimeout(check, 400);
});
window.addEventListener('resize', function(){
  setTimeout(check, 200);
});

/* Also try locking portrait via API */
try {
  if(screen.orientation && screen.orientation.lock){
    screen.orientation.lock('portrait-primary')
      .then(function(){ goToQuiz(); })
      .catch(function(){
        /* API failed - rely on manual rotation detection above */
      });
  }
} catch(e){}
</script>
</body>
</html>
