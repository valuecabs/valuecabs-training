<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Test Controls</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#004b76; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:Raleway,Arial,sans-serif; padding:20px; }
.wrap { text-align:center; width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; }
h2 { color:rgba(255,255,255,0.5); font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-bottom:4px; }
.btn { background:#f0801e; color:#fff; border:none; border-radius:50px; padding:16px 20px; font-size:14px; font-weight:800; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-decoration:none; display:block; text-align:center; font-family:inherit; }
.btn.blue { background:#0c84b9; }
.btn.red  { background:#e74c3c; }
.status { font-size:12px; color:#2ecc40; font-weight:700; min-height:18px; text-align:center; }
.divider { border:none; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <h2>Test Controls</h2>

  <a class="btn" href="index.html" onclick="setTestData()">▶ Start Training (full)</a>
  <a class="btn blue" href="portrait.html" onclick="setTestData()">Test Portrait Screen</a>
  <a class="btn blue" href="quiz.html" onclick="setTestData()">Test Quiz Directly</a>

  <hr class="divider">

  <button class="btn red" onclick="resetAll()">🗑 Reset All (clear localStorage)</button>
  <button class="btn red" onclick="resetAttempts()">↩ Reset Attempts Only</button>

  <div class="status" id="status"></div>
</div>

<script>
function setTestData(){
  try {
    sessionStorage.setItem('vc_driver_num','999');
    sessionStorage.setItem('vc_driver_name','Test Driver');
    sessionStorage.setItem('vc_car_reg','TEST 001');
  } catch(e){}
}

function resetAll(){
  try {
    localStorage.removeItem('vc_completed');
    localStorage.removeItem('vc_completed_date');
    localStorage.removeItem('vc_attempt_num');
    sessionStorage.removeItem('vc_driver_num');
    sessionStorage.removeItem('vc_driver_name');
    sessionStorage.removeItem('vc_car_reg');
    sessionStorage.removeItem('vc_quiz_score');
    document.getElementById('status').textContent = '✅ All data cleared — ready to test from scratch';
  } catch(e){
    document.getElementById('status').textContent = '❌ Error: ' + e.message;
  }
}

function resetAttempts(){
  try {
    localStorage.removeItem('vc_attempt_num');
    localStorage.removeItem('vc_completed');
    document.getElementById('status').textContent = '✅ Attempts reset — can retake quiz';
  } catch(e){
    document.getElementById('status').textContent = '❌ Error: ' + e.message;
  }
}

/* Show current state */
try {
  var completed = localStorage.getItem('vc_completed');
  var attempts  = localStorage.getItem('vc_attempt_num');
  if(completed || attempts){
    document.getElementById('status').textContent =
      'Current: completed=' + (completed||'no') + ', attempts=' + (attempts||'0');
  }
} catch(e){}
</script>
</body>
</html>
